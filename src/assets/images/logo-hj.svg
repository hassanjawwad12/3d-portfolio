<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HJ monogram">
  <defs>
    <linearGradient id="hj-bg" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <!-- rounded badge -->
  <rect x="2" y="2" width="92" height="92" rx="22" fill="url(#hj-bg)"/>
  <rect x="2.75" y="2.75" width="90.5" height="90.5" rx="21.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- HJ initials, drawn as strokes so they are font-independent -->
  <g stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- H -->
    <path d="M22 30 V66"/>
    <path d="M40 30 V66"/>
    <path d="M22 48 H40"/>
    <!-- J: top serif, stem, and a hook that curls clear of the H -->
    <path d="M54 30 H74"/>
    <path d="M66 30 V56 Q66 66 57 66 Q49 66 49 57"/>
  </g>
</svg>
